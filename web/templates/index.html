<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odds Board</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% set page = 'home' %}{% include '_header.html' %}
<div class="ticker" id="ticker">Connecting…</div>
<div class="content">

  <div class="section">
    <div class="section-header">On the panel now</div>
    <div class="section-body single">
      <div class="panel" id="panel"><div class="idle-note">Loading…</div></div>
      <div class="stat" id="details"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-header" id="card-title">Today's card</div>
    <div class="section-body single"><div class="card-wrap" id="card"><div class="hint">Loading…</div></div></div>
  </div>

  <div class="section">
    <div class="section-header">Quick controls</div>
    <div class="section-body">
      <div class="field">
        <label>Track</label>
        <div class="toggle" data-key="track">
          <button data-val="auto">Auto</button><button data-val="saratoga">Saratoga</button><button data-val="belmont">Belmont</button>
        </div>
      </div>
      <div class="field">
        <label>Race view</label>
        <div class="toggle" data-key="view">
          <button data-val="full">Full board</button><button data-val="big_mtp">Big MTP</button>
        </div>
      </div>
      <div class="hint">Changes reach the panel within a few seconds. Auto follows whichever track is racing today, Saratoga first.</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">System</div>
    <div class="section-body single"><div class="stat" id="system">…</div></div>
  </div>
</div>

<script>
const TRACK_NAMES = {saratoga: "Saratoga", belmont: "Belmont Park"};
let lastMode = null;

function fmtPost(iso) {
  if (!iso) return "";
  const [h, m] = iso.slice(11, 16).split(":").map(Number);
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"} ET`;
}

// Picture of the panel (race board or clock & weather), reloaded in place so it doesn't flicker
function showFrame(alt) {
  const panel = document.getElementById("panel");
  let img = panel.querySelector("img");
  if (!img) {
    panel.innerHTML = "";
    img = document.createElement("img");
    img.onerror = () => { panel.innerHTML = '<div class="idle-note">Waiting for the first picture…</div>'; };
    panel.appendChild(img);
  }
  img.alt = alt;
  img.src = `/board.png?t=${Date.now()}`;
}

// Today's card: every race with its post time, the next race highlighted
let lastCard = null;
function renderCard(s) {
  const key = JSON.stringify([s.track, s.track_now, s.card]);
  if (key === lastCard) return;
  lastCard = key;
  const name = TRACK_NAMES[s.track_now] || "";
  document.getElementById("card-title").textContent = name ? `Today's card · ${name}` : "Today's card";
  const box = document.getElementById("card");
  if (!s.track_now) {
    box.innerHTML = `<div class="hint">No racing at ${s.track === "auto" ? "Saratoga or Belmont" : TRACK_NAMES[s.track]} today.</div>`;
    return;
  }
  if (!s.card || !s.card.length) {
    box.innerHTML = `<div class="hint">No races listed for ${name} today.</div>`;
    return;
  }
  const until = m => m >= 60 ? `in ${Math.floor(m / 60)}h ${m % 60}m` : `${m} MTP`;
  const label = c => c.state === "done" ? "Off" : c.state === "next" ? `Next · ${until(c.mtp)}` : "";
  box.innerHTML = `<table class="card"><thead><tr><th>Race</th><th>Post (ET)</th><th>Distance</th><th>Surface</th>
    <th>Field</th><th></th></tr></thead><tbody>` + s.card.map(c => `<tr class="${c.state}">
    <td class="num">${c.race}</td><td>${fmtPost(c.post_time).replace(" ET", "")}</td><td>${c.distance}</td>
    <td>${c.surface}</td><td class="num">${c.runners}</td><td class="state">${label(c)}</td></tr>`).join("") + `</tbody></table>`;
}

async function refresh() {
  try {
    const r = await fetch("/api/status"); const d = await r.json();
    const s = d.status, racing = d.racing;
    document.querySelectorAll(".toggle").forEach(t => {
      t.querySelectorAll("button").forEach(b => b.classList.toggle("on", racing[t.dataset.key] === b.dataset.val));
    });
    const ticker = document.getElementById("ticker");
    const panel = document.getElementById("panel");
    const details = document.getElementById("details");
    if (!s || s.age_seconds > 30) {
      ticker.textContent = "Display not running — check the service or restart from Settings";
      panel.innerHTML = '<div class="idle-note">No signal from the display</div>';
      details.innerHTML = ""; lastMode = null; return;
    }
    const track = s.track_now ? (TRACK_NAMES[s.track_now] || s.track_now) + (s.track === "auto" ? " (auto)" : "")
                              : "No NYRA racing today";
    renderCard(s);
    if (s.mode === "race") {
      ticker.textContent = `${track} · Race ${s.race} · Post ${fmtPost(s.post_time)}`;
      showFrame("Race board");
      details.innerHTML = `<b>Race ${s.race}</b> · ${s.runners} running · view: ${s.view === "big_mtp" ? "Big MTP" : "Full board"}`;
    } else if (s.mode === "card") {
      ticker.textContent = `${track} · No race within the window — showing today's card`;
      showFrame("Today's card");
      details.innerHTML = "";
    } else {
      ticker.textContent = `${track} · No race within the window — showing clock & weather`;
      showFrame("Clock and weather");
      details.innerHTML = "";
    }
    if (s.feed_updated) details.innerHTML += `<br>NYRA last checked: ${s.feed_updated.slice(11)}`;
    if (s.feed_error) details.innerHTML += `<br><span class="err-text">Last error: ${s.feed_error}</span>`;
    lastMode = s.mode;
  } catch (e) {
    document.getElementById("ticker").textContent = "Can't reach the board";
  }
}

async function refreshSystem() {
  try {
    const d = await (await fetch("/api/system")).json();
    const up = d.uptime_secs != null ? `${Math.floor(d.uptime_secs / 3600)}h ${Math.floor(d.uptime_secs % 3600 / 60)}m` : "—";
    document.getElementById("system").innerHTML =
      `CPU temp: <b>${d.cpu_temp_c != null ? d.cpu_temp_c + "°C" : "—"}</b> · Uptime: <b>${up}</b>`;
  } catch (e) {}
}

document.querySelectorAll(".toggle").forEach(t => {
  t.querySelectorAll("button").forEach(b => b.addEventListener("click", async () => {
    t.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    await fetch("/api/config", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({config: {racing: {[t.dataset.key]: b.dataset.val}}})});
    setTimeout(refresh, 1500);
  }));
});

refresh(); refreshSystem();
setInterval(refresh, 2000); setInterval(refreshSystem, 30000);
</script>
</body>
</html>
